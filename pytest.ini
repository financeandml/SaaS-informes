; La batería sigue siendo de `unittest`: `python -m unittest discover -s tests -p "prueba_*.py"` no cambia.
; Esto solo enseña a pytest a encontrarla, para que `pytest -q` del spec recorra exactamente los mismos ficheros.
[pytest]
testpaths = tests
python_files = prueba_*.py
markers =
    regresion(*ids): las regresiones de docs/spec/07 que cubre la prueba, p. ej. @pytest.mark.regresion("R3")
