# 01_indice.yaml · Fuente única del índice. Formulario, informe, numeración, anclas y QA leen de aquí.
# resp: sistema | motor | analista | mixto · fuentes: sec | nasdaq | tesoro | yahoo_iv | analista | motor
# entradas: ids de 04_entradas.yaml · bloques: contenido obligatorio, en orden de impresión.
version: 1
reglas:
  - "Letras A–I consecutivas en orden de impresión; anclas parte-<letra> y ap-<n>."
  - "Títulos literales, en español. El formulario usa esta misma numeración (27–30)."
  - "Salto de página solo antes de cada parte. Sin notas sobre el orden de las partes."
  - "Fila o bloque que no aplica al sector o que la compañía no publica: no se imprime (no N/A)."
  - "Apartado que no aplica: «No aplica: <motivo>» con cita. Nunca vacío ni «pendiente»."
  - "Cuadros numerados correlativamente en orden de impresión («Cuadro N.»)."

partes:
  A: {titulo: "Resumen ejecutivo y contexto de la tesis"}
  B: {titulo: "Perfil corporativo y modelo de negocio"}
  C: {titulo: "Análisis fundamental y métricas financieras"}
  D: {titulo: "Valoración y precio objetivo"}
  E: {titulo: "Mercado objetivo y posicionamiento competitivo"}
  F: {titulo: "Riesgos y diligencia debida"}
  G: {titulo: "Tesis de inversión y gestión de la posición", subtitulo: "lo rellena el analista (formulario de posición)"}
  H: {titulo: "Opciones, derivados y posicionamiento institucional", subtitulo: "bolsa (Nasdaq) y, para la volatilidad implícita, Yahoo Finance"}
  I: {titulo: "Apéndices y herramientas"}

portada:
  izquierda:
    - "Caja de recomendación: recomendación, precio objetivo a h meses, precio (cierre oficial y fecha), potencial, margen de seguridad, recorrido/riesgo, horizonte"
    - "Ficha breve: ticker · bolsa, cierre fiscal, empleados, acciones, free float, precio, capitalización, últimas presentaciones"
  derecha:
    - "Resumen: tesis.resumen y párrafo factual de plantilla, con citas"
    - "Objetivos vigentes de la compañía"
    - "Cuadro 1"

apartados:
  1:
    parte: A
    titulo: "Ficha de empresa"
    resp: sistema
    fuentes: [sec, nasdaq]
    entradas: [meta.nombre_presentacion, meta.sector, perfil.fundacion, perfil.empleados]
    bloques:
      - "Cuadro Ficha (dato · valor · fuente): nombre de presentación y registral, ticker · bolsa, CIK · SIC, sector del analista y paquete DCF, constitución, sede, cierre fiscal descrito (p. ej. «último domingo de septiembre, 52/53 semanas»), fundación, empleados, auditor, acciones en circulación, free float, precio y cierre anterior, capitalización, rango 52 semanas, volumen medio 3 meses, últimas presentaciones"
  2:
    parte: A
    titulo: "Resumen ejecutivo y contexto de la tesis"
    resp: mixto
    fuentes: [sec, nasdaq, motor, analista]
    entradas: [tesis.resumen, tesis.por_que_ahora, tesis.vision_vs_mercado]
    bloques:
      - "Texto del analista: resumen, por qué ahora y visión frente a lo que descuenta el precio"
      - "Párrafo factual de plantilla: último trimestre, ejercicio, guía vigente, balance y retribución; una cita por frase"
      - "Cuadro 1 (5 ejercicios): ingresos, EBITDA, margen operativo, beneficio neto, BPA diluido, FCF, deuda neta, DN/EBITDA"
      - "Cuadro 2: objetivos vigentes de la compañía (métrica, periodo, rango, fecha, documento, página)"
      - "Hitos: 8-K de los últimos 12 meses con los ítems traducidos"
  3:
    parte: A
    titulo: "Caso de inversión — los 5 pilares de la tesis"
    resp: analista
    fuentes: [analista, sec]
    entradas: [pilares]
    bloques:
      - "Exactamente 5 pilares: título, argumento con citas, KPI de seguimiento y recuadro «Riesgo (10-K, Item 1A)» con la versión en español del analista y su página (literal, en el HTML)"
  4:
    parte: B
    titulo: "¿Qué hace la empresa? — Productos, servicios y mercados"
    resp: mixto
    fuentes: [sec, analista]
    entradas: [perfil.descripcion, perfil.segmentos_ok]
    bloques:
      - "Descripción del analista, apoyada en tarjetas del Item 1"
      - "Cuadro ingresos por segmento, producto y geografía (XBRL dimensional; 3 ejercicios y últimos 12 meses) y gráfico de mezcla"
  5:
    parte: B
    titulo: "Estructura corporativa — Accionariado, filiales y participaciones"
    resp: sistema
    fuentes: [sec]
    bloques:
      - "Cuadro accionistas ≥ 5 % (DEF 14A y 13D/13G vigentes) y participación de consejeros y directivos"
      - "Cuadro filiales significativas (Exhibit 21 del índice del 10-K en EDGAR)"
      - "Clases de acciones y participaciones relevantes, si existen"
  6:
    parte: B
    titulo: "Equipo directivo — CEO, CFO y principales ejecutivos; trayectoria"
    resp: mixto
    fuentes: [sec, analista]
    entradas: [equipo.track_record, equipo.asignacion_capital]
    bloques:
      - "Cuadro ejecutivos: nombre, edad, cargo, desde (10-K o DEF 14A)"
      - "Cuadro Summary Compensation Table (DEF 14A)"
      - "Track record y asignación de capital: juicio del analista con evidencias"
  7:
    parte: B
    titulo: "Proyectos y catalizadores — Hoja de ruta, fechas clave y palancas de la tesis"
    resp: mixto
    fuentes: [nasdaq, sec, analista]
    entradas: [catalizadores, direccion.citas]
    bloques:
      - "Cuadro fechas clave: próximos resultados (Nasdaq, anunciada o estimada, siempre ≥ fecha del informe), junta, dividendo"
      - "Cuadro catalizadores: fecha o ventana, evento, pilar, impacto, probabilidad, fuente"
      - "Lo que dijo la dirección: citas de la última call elegidas por el analista, en español (literal, en el HTML)"
  8:
    parte: C
    titulo: "Estado de resultados — Ingresos, EBITDA, EBIT, margen operativo, margen neto y BPA"
    resp: sistema
    fuentes: [sec]
    entradas: [val.normalizaciones]
    bloques:
      - "Gráficos: ingresos y margen operativo; deuda neta y DN/EBITDA"
      - "Cuadro 5 ejercicios + 4 últimos trimestres fiscales («nT FYaa» y fecha de cierre); líneas tal como las publica la compañía; trimestre derivado marcado"
      - "Bloque normalizado (si hay normalizaciones), separado de las cifras publicadas"
      - "Recortes de la cuenta de resultados"
  9:
    parte: C
    titulo: "Balance de situación — Activos, deuda neta, caja, patrimonio neto"
    resp: sistema
    fuentes: [sec]
    bloques:
      - "Cuadro 5 ejercicios + 4 trimestres; deuda neta con la definición única (06 §5); arrendamientos aparte; acciones ajustadas por splits detectados"
      - "Recortes del balance"
  10:
    parte: C
    titulo: "Flujo de caja — FCF, capex, dividendos y recompras"
    resp: sistema
    fuentes: [sec]
    bloques:
      - "Cuadro flujo operativo, capex, FCF, FCF/ingresos, retribución en acciones, adquisiciones, dividendos, recompras, deuda emitida y amortizada, retribución total y su peso sobre el FCF; FCF de la compañía si lo publica"
      - "Recortes del estado de flujos"
  11:
    parte: C
    titulo: "Rentabilidad y eficiencia — ROE, ROIC, ROA y márgenes"
    resp: sistema
    fuentes: [sec, motor]
    bloques:
      - "Cuadro ROE, ROA, ROIC, márgenes, cobertura de intereses, conversión de caja, rotación de activos, payout, capex/ingresos"
      - "Cuadro últimos 12 meses"
      - "ROIC frente a WACC, 5 años"
  12:
    parte: D
    titulo: "Valoración intrínseca — DCF (descuento de flujos de caja)"
    resp: motor
    fuentes: [motor, sec, nasdaq, tesoro, analista]
    entradas: ["val.*", "wacc.*", "tv.*"]
    bloques:
      - "Cuadro escenarios: probabilidad, WACC, g, valor hoy, valor a h meses; valor razonable ponderado"
      - "Cuadro construcción del WACC"
      - "Cuadro puente: valor de empresa → fondos propios → por acción"
      - "Cuadro entradas del modelo frente al dato oficial (deben coincidir)"
      - "Cuadro supuestos generales con origen y justificación"
      - "Cuadro motor frente al Excel del analista (solo si se importó)"
  13:
    parte: D
    titulo: "Escenario pesimista — Supuestos, FCF y valoración"
    resp: motor
    entradas: ["esc.pesimista.*"]
    bloques:
      - "Narrativa del escenario (analista)"
      - "Cuadro: drivers por año, FCFF, valor terminal y sus contrastes, valor de empresa, puente, valor por acción hoy y a h meses, recorrido"
  14:
    parte: D
    titulo: "Escenario base — Supuestos, FCF y valoración"
    resp: motor
    entradas: ["esc.base.*"]
    bloques: ["Igual que 13"]
  15:
    parte: D
    titulo: "Escenario optimista — Supuestos, FCF y valoración"
    resp: motor
    entradas: ["esc.optimista.*"]
    bloques: ["Igual que 13"]
  16:
    parte: D
    titulo: "Análisis de sensibilidad — WACC y crecimiento terminal"
    resp: motor
    bloques:
      - "Matriz 5×5 WACC × g del escenario base (05 §8), celda base marcada y color frente al precio"
      - "Matriz opcional crecimiento de ingresos × margen terminal"
  17:
    parte: D
    titulo: "Valoración por múltiplos — PER, EV/EBITDA, EV/Ventas, P/FCF, PEG"
    resp: mixto
    fuentes: [sec, nasdaq, motor, analista]
    entradas: [comparables, mult.objetivos]
    bloques:
      - "Cuadro múltiplos actuales TTM y NTM, con su cálculo"
      - "Cuadro histórico propio de 5 años (mínimo, mediana, máximo)"
      - "Cuadro comparables del analista con medianas; excluidos marcados"
      - "Valor implícito por acción (mediana de comparables y múltiplos objetivo justificados), solo como contraste"
  18:
    parte: D
    titulo: "DCF inverso — Expectativas implícitas en el precio actual"
    resp: motor
    bloques:
      - "Crecimiento de ingresos implícito, margen terminal implícito y crecimiento constante del FCFF implícito, frente al escenario base y al histórico de 5 años"
  19:
    parte: D
    titulo: "Valoración por suma de partes (SOTP, cuando aplique)"
    resp: mixto
    entradas: [sotp.aplica, sotp.segmentos]
    aplica: "≥ 2 segmentos con resultado operativo en XBRL y sotp.aplica"
    si_no_aplica: "Motivo en español con la cita de la nota de segmentos (literal, en el HTML)"
    bloques:
      - "Cuadro por segmento: métrica, múltiplo o método, justificación, valor; costes corporativos; puente; por acción; frente al DCF"
  20:
    parte: D
    titulo: "Precio objetivo y margen de seguridad — Valor razonable, potencial alcista y bajista, y consenso"
    resp: motor
    fuentes: [motor, nasdaq]
    bloques:
      - "Cuadro: PO, valor razonable hoy, potencial, margen de seguridad, downside pesimista, recorrido/riesgo (definiciones de 05 §7)"
      - "Contraste: rango por múltiplos, consenso Nasdaq (media, nº de analistas, compra/mantener/venta, rango) y 1 Year Target; aviso si divergen > 20 %"
      - "Recomendación sugerida por la regla frente a la del analista"
  21:
    parte: E
    titulo: "Tamaño de mercado — TAM / SAM / SOM"
    resp: analista
    entradas: [mercado.cifras]
    bloques:
      - "Texto de plantilla con las cifras del analista y sus citas"
      - "Cuadro: cifra, clase, año, método, fuente; cuota implícita = ingresos / SAM"
  22:
    parte: E
    titulo: "Análisis competitivo — Competidores, cuotas de mercado y comparables"
    resp: analista
    entradas: [competencia.competidores, comparables]
    bloques:
      - "Competidores y por qué compiten (analista, con evidencias del Item 1)"
      - "Cuotas con fuente"
      - "Cuadro comparables: cifras SEC y cotización Nasdaq"
      - "Gráfico crecimiento frente a margen"
  23:
    parte: E
    titulo: "Ventajas competitivas y foso defensivo — Barreras de entrada y sostenibilidad"
    resp: analista
    entradas: [moat.fuentes, moat.amenazas]
    bloques:
      - "Fuentes del moat con evidencias, durabilidad y tendencia"
      - "Datos de apoyo del sistema: ROIC − WACC 5 años, estabilidad del margen, I+D/ingresos"
      - "Amenazas"
  24:
    parte: F
    titulo: "Riesgos principales — Regulatorio, financiero, competitivo y ejecución"
    resp: mixto
    entradas: [riesgos.top]
    bloques:
      - "Matriz probabilidad × impacto de los 5 riesgos del analista, con mitigante y señal temprana"
      - "Recuento por familia de los riesgos del Item 1A (clasificación por reglas, corregible); epígrafes literales solo en el HTML y en 39"
  25:
    parte: F
    titulo: "Caso bajista — Qué tendría que salir mal para invalidar la tesis"
    resp: mixto
    entradas: [bear.disparadores]
    bloques:
      - "Disparadores cuantificados: métrica, umbral y plazo"
      - "Riesgo de cada pilar (del apartado 3)"
      - "Valor y probabilidad del escenario pesimista (plantilla)"
  26:
    parte: F
    titulo: "Historial de resultados — ¿Ha fallado antes? Causas y aprendizajes"
    resp: mixto
    entradas: [historial.guia_manual, historial.causas]
    bloques:
      - "Cuadro guía → real por trimestre (8 trimestres) con desvío"
      - "Cuadro consenso frente a BPA publicado (Nasdaq)"
      - "Objetivos a largo plazo frente a real, si los hay"
      - "Causas y aprendizajes (analista; obligatorio si hay fallos)"
  27:
    parte: G
    titulo: "Tesis de inversión consolidada — Argumento, asunciones clave y horizonte temporal"
    resp: analista
    entradas: [pos.argumento, pos.asunciones, val.horizonte_meses]
    bloques: ["Argumento literal, asunciones con su driver y umbral, horizonte"]
  28:
    parte: G
    titulo: "Lista de comprobación de entrada — Criterios mínimos antes de abrir posición"
    resp: mixto
    entradas: [pos.checklist]
    bloques: ["Cuadro criterio · tipo · ¿cumplido? · evidencia, con recuento sí/no/parcial sin maquillar"]
  29:
    parte: G
    titulo: "Gestión del riesgo — Invalidación de tesis, tamaño de posición y volatilidad"
    resp: mixto
    entradas: [pos.invalidacion, pos.tamano_pct, pos.tamano_porque, pos.stop, pos.drawdown_tolerado]
    bloques:
      - "Invalidaciones medibles"
      - "Tamaño y justificación frente al tamaño sugerido"
      - "Volatilidad: realizada 1 año, IV ATM 30 días, máximo drawdown 1 y 3 años, beta"
  30:
    parte: G
    titulo: "Seguimiento tras la entrada — KPI, fechas de revisión y criterios de salida"
    resp: mixto
    entradas: [pos.kpis, pos.fechas_revision, pos.salida]
    bloques: ["Cuadro KPIs (actual, verde, rojo, fuente, frecuencia); fechas de revisión; criterios de salida"]
  31:
    parte: H
    titulo: "Cadena de opciones — Ratio put/call, volumen y sesgo implícito"
    resp: sistema
    fuentes: [nasdaq]
    bloques:
      - "Por vencimiento: volumen e interés abierto de calls y puts, P/C por volumen y por OI, nº de strikes; total"
      - "Strikes con más OI y max pain del vencimiento mensual más próximo"
  32:
    parte: H
    titulo: "Posicionamiento en derivados — Volatilidad implícita, interés abierto (ratio put/call), volumen y sesgo implícito"
    resp: sistema
    fuentes: [nasdaq, yahoo_iv]
    bloques:
      - "Estructura temporal de IV (ATM, 90 %, 110 %) y sesgo put − call, solo en vencimientos cuyo OI cuadra con Nasdaq"
      - "IV frente a volatilidad realizada a 30 y 90 días"
      - "Movimiento esperado en resultados (straddle ATM de la cadena Nasdaq)"
  33:
    parte: H
    titulo: "Posicionamiento institucional — 13F, fondos y principales accionistas"
    resp: sistema
    fuentes: [nasdaq, sec]
    bloques:
      - "Resumen 13F"
      - "15 mayores tenedores con la fecha de su 13F (antiguos marcados)"
      - "Titulares ≥ 5 % según 13D/13G"
  34:
    parte: H
    titulo: "Operaciones de directivos — Compras, ventas y participación de la dirección"
    resp: sistema
    fuentes: [nasdaq, sec]
    bloques:
      - "Recuento a 3 y 12 meses"
      - "Últimas 15 operaciones cruzadas con el Form 4 de EDGAR (código, acciones, precio, plan 10b5-1)"
      - "Participación del management (proxy)"
  35:
    parte: H
    titulo: "Posicionamiento en corto — Interés en corto y días para cubrir"
    resp: sistema
    fuentes: [nasdaq]
    bloques: ["12 fechas de liquidación: interés en corto, volumen medio, días para cubrir, % de acciones en circulación; tendencia"]
  36:
    parte: I
    titulo: "Modelo financiero y supuestos detallados"
    resp: motor
    bloques:
      - "Todas las entradas: valor, unidad, origen y autor"
      - "Proyección completa del escenario base"
      - "Excel exportado (nombre y huella) y, si lo hubo, comparación con el del analista"
  37:
    parte: I
    titulo: "Fuentes y referencias"
    resp: sistema
    bloques: ["Documentos (tipo, periodo, fecha, nº de registro, verificado en EDGAR, huella), APIs (URL, hora, huella) y versión del fichero de entradas"]
  38:
    parte: I
    titulo: "Datos complementarios y notas metodológicas"
    resp: sistema
    bloques:
      - "Recuento por estado de verificación"
      - "Discrepancias: debe decir «Ninguna»"
      - "Huecos materiales (≤ 15 líneas; el resto en auditoria.json)"
      - "Definiciones y convenciones (06 §5)"
  39:
    parte: I
    titulo: "Documentación complementaria — recortes de las páginas citadas y respuestas literales de las fuentes"
    resp: sistema
    bloques:
      - "Recortes por apartado, en el orden del índice"
      - "Por cada fuente consultada: URL, hora, huella y campos usados con su valor, en un cuadro en español (la respuesta completa queda en disco)"
