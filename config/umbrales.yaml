# umbrales.yaml · Umbrales editables. Los specs los citan por clave; ningún umbral en código.
recomendacion:
  escala: [Comprar, Mantener, Vender]
  comprar: {potencial_min: 0.15, recorrido_riesgo_min: 1.5}
  vender: {potencial_max: -0.10}
  # el resto → Mantener
horizonte_meses_defecto: 12
erp_antiguedad_max_dias: 45            # F11: una ERP de referencia más antigua deja de proponerse (config/erp.yaml)
prob_base_min: 0.40
divergencia_multiplos_aviso: 0.20
fallo_guia_obliga_causas: 0.02
g_max: 0.04
wacc_menos_g_min_pp: 2.0
ronic_defecto_pp: 2.0
ronic_max_x_wacc: 3
peso_vt_aviso: 0.75
vt_contraste_aviso: 0.15
beta_r2_min: 0.10
atipicos_iqr: 3
comparables_antiguedad_max_meses: 15
tolerancia_oi_yahoo_nasdaq: 0.02
reexpresion_nota: 0.005
form4_dias_presentacion_max: 10       # 28: un Form 4 se presenta en 2 días hábiles; con retrasos, hasta este margen
acciones_4t_derivadas_tolerancia: 0.001   # 03: 4T de acciones medias derivado de la SEC frente al publicado; dentro, manda el documento
pdf_vs_edgar_similitud_min: 0.98
cita_similitud_min: 0.90
biotech_ingresos_min_musd: 50     # 05 §2: SIC 2834–2836 y 8731 por debajo de estos ingresos (mln USD) → bloqueo v1
# 05 §2: comprobaciones de los paquetes sectoriales (avisos del motor; no bloquean)
sector:
  regla_40_min: 0.40              # software: crecimiento de ingresos + margen de FCF del último ejercicio
  sbc_ingresos_max: 0.10          # software: SBC / ingresos del último ejercicio
  sbc_proyeccion_pp: 0.03         # software: SBC del año 1 del escenario base por debajo del histórico en más de 3 p. p.
  ciclo_anios: [7, 10]            # semiconductores: la mediana del margen operativo, con 7 a 10 ejercicios de la SEC
  ciclo_desvio_pp: 0.05           # año base o margen terminal a más de 5 p. p. de esa mediana → pico o valle de ciclo
  arrendamientos_ve_max: 0.05     # consumo y telecom: arrendamientos fuera de la deuda por encima del 5 % del VE de mercado
  pensiones_cap_max: 0.02         # industrial: déficit de pensiones sin ajuste del puente por encima del 2 % de la capitalización
  apalancamiento_max: 0.60        # utilities: D / (D + E) de mercado
relleno_pagina_min: 0.25
# motor (05 §8)
sensibilidad: {wacc_pp: [-1.0, -0.5, 0.0, 0.5, 1.0], g_pp: [-0.5, -0.25, 0.0, 0.25, 0.5]}
reverse_rangos: {cagr: [-0.50, 1.00], margen: [-0.50, 0.95], fcff: [-0.50, 1.00]}
frase_variacion_estable: 0.005   # |variación| menor: «se mantuvieron» (06 §1)
linter_tolerancia: 0.01          # 06 §2: una cifra del analista casa con un Hecho dentro de su redondeo impreso; si es redonda («15.000»), también dentro del 1 %
frase_palabras_aviso: 40         # 02 › Estilo: frases ≤ 35 palabras; desde 40, aviso en la página interna de QA (no bloquea)
parrafo_frases_max: 6            # 02 › Estilo: párrafos ≤ 6 frases; más, aviso (no bloquea)
